name: glue-jobs-operator ship action

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ci-ship-${{ inputs.git_repo }}-${{ github.ref }}-1
  cancel-in-progress: true

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          submodules: recursive

      - uses: olegtarasov/get-tag@53af8e1e538a0ffab949cdde3e332d8e58e8630f # v2.1
        id: tagName
        with:
          tagRegex: '(.*)'
          tagRegexGroup: 1

      - name: Create valid tag(s)
        id: tags
        run: |
          name="90poe/glue-jobs-operator"
          output="$name:${{ steps.tagName.outputs.tag }},$name:latest"

          echo "::set-output name=all_tags::${output}"

      - name: Install latest major GO version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.21'

      - name: Make build for ${{ steps.tags.outputs.all_tags }}
        run:
          echo ${{ steps.tagName.outputs.tag }} > version.txt;
          make build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to Docker Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASS }}

      - name: Dockerise
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./
          builder: ${{ steps.buildx.outputs.name }}
          platforms: "linux/amd64,linux/arm64"
          tags: ${{ steps.tags.outputs.all_tags }}
          file: Dockerfile
          push: true

      # - name: Trigger RTDs build
      #   uses: dfm/rtds-action@v1
      #   with:
      #     webhook_url: ${{ secrets.RTDS_WEBHOOK_URL }}
      #     webhook_token: ${{ secrets.RTDS_WEBHOOK_TOKEN }}
      #     commit_ref: ${{ github.ref }}
